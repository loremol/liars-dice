name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-2025
          - os: macos-15
            osx_architectures: arm64;x86_64
    runs-on: ${{ matrix.os }}
    env:
      OSX_ARCHITECTURES: ${{ matrix.osx_architectures }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install GLFW build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev wayland-protocols libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev pkg-config
      - uses: actions/cache@v6.1.0
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-Debug-${{ hashFiles('CMakeLists.txt', '*/CMakeLists.txt', 'cmake/**') }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON ${OSX_ARCHITECTURES:+"-DCMAKE_OSX_ARCHITECTURES=$OSX_ARCHITECTURES"}
      - name: Build
        run: cmake --build build --config Debug --parallel
      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure
